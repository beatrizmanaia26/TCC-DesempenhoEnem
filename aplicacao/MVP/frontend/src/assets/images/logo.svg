<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="80" y="80" width="864" height="864" rx="120" fill="none" stroke="#1e40af" stroke-width="60"/>
  
  <!-- Left side lines (text placeholder) -->
  <rect x="220" y="240" width="200" height="40" rx="20" fill="#64748b"/>
  <rect x="220" y="380" width="200" height="40" rx="20" fill="#64748b"/>
  
  <!-- Search circle (magnifying glass) -->
  <circle cx="630" cy="380" r="180" fill="none" stroke="#1e40af" stroke-width="60"/>
  <circle cx="630" cy="380" r="40" fill="#4ade80"/>
  
  <!-- Magnifying glass handle -->
  <line x1="770" y1="520" x2="880" y2="630" stroke="#1e40af" stroke-width="60" stroke-linecap="round"/>
  
  <!-- Bar chart -->
  <rect x="240" y="680" width="80" height="200" rx="20" fill="#0369a1"/>
  <rect x="420" y="580" width="80" height="300" rx="20" fill="#6366f1"/>
  <rect x="600" y="520" width="80" height="360" rx="20" fill="url(#gradientBar)"/>
  
  <!-- Gradient definition for third bar -->
  <defs>
    <linearGradient id="gradientBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>