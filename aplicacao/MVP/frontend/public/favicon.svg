<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none" stroke="#1e40af" stroke-width="20"/>
  
  <!-- Left side lines -->
  <rect x="55" y="70" width="50" height="12" rx="6" fill="#64748b"/>
  <rect x="55" y="110" width="50" height="12" rx="6" fill="#64748b"/>
  
  <!-- Search circle -->
  <circle cx="160" cy="110" r="45" fill="none" stroke="#1e40af" stroke-width="15"/>
  <circle cx="160" cy="110" r="10" fill="#4ade80"/>
  
  <!-- Magnifying glass handle -->
  <line x1="195" y1="145" x2="220" y2="170" stroke="#1e40af" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Bar chart -->
  <rect x="60" y="185" width="20" height="50" rx="5" fill="#0369a1"/>
  <rect x="105" y="165" width="20" height="70" rx="5" fill="#6366f1"/>
  <rect x="150" y="150" width="20" height="85" rx="5" fill="#4ade80"/>
</svg>